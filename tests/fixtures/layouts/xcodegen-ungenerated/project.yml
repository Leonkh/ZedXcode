# XcodeGen spec for the not-yet-generated layout.
#
# No Xcode container is committed here: generate.sh stands in for
# `xcodegen generate` and writes MyApp.xcodeproj (git-ignored) from template/,
# which holds what XcodeGen 2.x produces from this file (the same project as
# tests/fixtures/myapp). Regenerate template/ deliberately when this changes.
name: MyApp
options:
  xcodeVersion: "14.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MyApp
        excludes:
          - run.lldbinit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MyApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    run:
      config: Debug
      customLLDBInit: "$(SRCROOT)/MyApp/run.lldbinit"
      environmentVariables:
        MYAPP_FLAG: "1"
      commandLineArguments:
        "-MyAppArg YES": true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
